name: CI/CD Pipeline - Test & Lint

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  docker-build:
    name: Validar build de Docker
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build --tag qr-emergencias-app:ci .

  test:
    name: Build & Test on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Compilar panel React
        run: npm run build:dashboard

      - name: Ejecutar pruebas automáticas
        run: npm test
