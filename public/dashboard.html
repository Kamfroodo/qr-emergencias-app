<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Panel de administración de fichas médicas de emergencia y generador de códigos QR para paramédicos.">
  <title>Panel de Fichas Médicas & QR de Emergencia</title>
  
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/dashboard-react.css">
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN SUPERIOR -->
  <nav class="navbar" aria-label="Navegación principal">
    <a href="/dashboard.html" class="brand-container">
      <div class="brand-icon">🚑</div>
      <div>
        <div style="display: flex; align-items: center;">
          <span class="brand-title">QR Emergencias</span>
          <span class="brand-badge">Sistema Activo</span>
        </div>
        <div style="font-size: 0.72rem; color: #94a3b8;">Fichas Médicas y Códigos QR para Rescatistas</div>
      </div>
    </a>

    <div class="nav-actions">
      <button id="btnNewProfile" class="btn btn-primary" type="button">
        <span>➕</span>
        <span>Nueva Ficha Médica</span>
      </button>

      <!-- Info del usuario autenticado -->
      <div id="userInfo" style="display:none; align-items:center; gap:0.6rem;">
        <div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,rgba(239,35,60,0.3),rgba(239,35,60,0.1));border:1px solid rgba(239,35,60,0.3);display:flex;align-items:center;justify-content:center;font-size:0.85rem;font-weight:600;color:#ef233c;" id="userAvatar">?</div>
        <div style="display:none;" class="nav-user-name" id="userName"></div>
        <button id="btnLogout" class="btn btn-secondary" type="button" style="padding:0.4rem 0.75rem;font-size:0.8rem;" title="Cerrar sesión">
          🚪 Salir
        </button>
      </div>
    </div>
  </nav>

  <!-- CONTENEDOR PRINCIPAL -->
  <main id="dashboard-root" class="dashboard-container"></main>

  <!-- SCRIPTS -->
  <script src="/js/auth.js"></script>
  <script src="/js/dashboard.bundle.js"></script>
</body>
</html>
